[project]
name = "idv"
version = "0.1.0"
description = "Driver identity verification: document checks, face matching, PAD, review routing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not gpu'"
filterwarnings = ["ignore:Call to deprecated close:DeprecationWarning:arq.worker"]
markers = [
    "integration: needs Redis and Postgres (make test-integration)",
    "gpu: needs CUDA and real model weights",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
