# CPU + fake pipeline by default. For the real models on the GPU:
#   docker compose -f compose.yml -f compose.gpu.yml up
name: idv

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  environment:
    IDV_REDIS_URL: redis://redis:6379/0
    IDV_DATABASE_URL: postgresql+psycopg://idv:idv@postgres:5432/idv
    IDV_PIPELINE: fake
  restart: unless-stopped

services:
  api:
    <<: *app
    command: uvicorn idv.service.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: arq idv.service.worker.WorkerSettings
    depends_on:
      api: { condition: service_healthy }

  redis:
    image: redis:7.4-alpine
    # Images pass through Redis; never let them reach disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idv
      POSTGRES_PASSWORD: idv
      POSTGRES_DB: idv
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "idv"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: [./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: [./deploy/grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["3000:3000"]
    depends_on: [prometheus]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    volumes: [mlflow:/mlflow]
    ports: ["5000:5000"]

volumes:
  pgdata:
  mlflow:
